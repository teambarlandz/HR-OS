# HR-OS cargo configuration — QEMU-first HIL
# Runners append ELF path automatically (cargo run semantics)

[build]
target = "thumbv7em-none-eabihf"

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

[target.thumbv7em-none-eabihf]
runner = "qemu-system-arm -M netduinoplus2 -cpu cortex-m4 -nographic -kernel"

[target.thumbv7em-none-eabi]
runner = "qemu-system-arm -M netduinoplus2 -cpu cortex-m4 -nographic -kernel"

[target.riscv32imac-unknown-none-elf]
runner = "qemu-system-riscv32 -machine sifive_e -nographic -bios none -kernel"

[target.riscv64-unknown-none-elf]
runner = "qemu-system-riscv32 -machine sifive_e -nographic -bios none -kernel"

# Custom JSON targets (x86_64-hros-none, riscv64-hros-none) use explicit --target path, no runner alias needed
