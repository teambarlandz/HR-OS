[package]
name = "hros-drivers"
version = "0.1.0"
edition = "2021"
description = "HR-OS HAL-adjacent drivers (Phase 3A + REPL) — uart, repl, pcie, timer"
license = "MIT OR Apache-2.0"

[dependencies]
hros-hal = { path = "../hros-hal" }
hros-cap = { path = "../hros-cap" }
hros-kernel = { path = "../hros-kernel" }
hros-jit = { path = "../hros-jit" }

[lib]
name = "hros_drivers"
path = "src/lib.rs"
